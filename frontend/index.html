<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>QuilCount - Full-Stack Developer | JavaScript & Plugin Development</title>
    <meta name="title" content="QuilCount - Full-Stack Developer | JavaScript & Plugin Development" />
    <meta name="description" content="Full-stack developer specializing in JavaScript, React, TypeScript, and plugin development for Twitch, WordPress, Figma, Notion, and Discord. Available for hire." />
    <meta name="keywords" content="full-stack developer, JavaScript, React, TypeScript, plugin development, Twitch, WordPress, Figma, Notion, Discord" />
    <meta name="author" content="QuilCount" />
    <meta name="robots" content="index, follow" />

    <!-- Theme Color -->
    <meta name="theme-color" content="#1f1f1f" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://quilcount.store/" />
    <meta property="og:title" content="QuilCount - Full-Stack Developer" />
    <meta property="og:description" content="Full-stack developer specializing in JavaScript, React, TypeScript, and plugin development. Available for hire." />
    <meta property="og:image" content="https://quilcount.store/favicon.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary" />
    <meta property="twitter:url" content="https://quilcount.store/" />
    <meta property="twitter:title" content="QuilCount - Full-Stack Developer" />
    <meta property="twitter:description" content="Full-stack developer specializing in JavaScript, React, TypeScript, and plugin development. Available for hire." />
    <meta property="twitter:image" content="https://quilcount.store/favicon.png" />

    <!-- Favicon -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/favicon.png" />

    <!-- Prevent flash of wrong theme -->
    <style>
      html {
        background-color: #1f1f1f;
        color: #eeeeee;
        transition: none !important;
      }
    </style>
    <script>
      try {
        let theme = localStorage.getItem('theme');
        if (!theme) {
          const mql = window.matchMedia('(prefers-color-scheme: dark)');
          theme = mql.matches ? 'dark' : 'light';
        }
        document.documentElement.classList.add(theme);
      } catch {
        document.documentElement.classList.add('light');
      }
    </script>

    <!-------------------- Preconnect to critical origins -------------------->
    <link rel="preconnect" href="https://api.quilcount.store" crossorigin />
    <link rel="preconnect" href="https://files.quilcount.store" crossorigin />

    <!-------------------- Preload LCP assets -------------------->
    <link rel="preload" as="image" href="https://files.quilcount.store/media/media-1769317602357-675056990.webp" fetchpriority="high" />
    <link rel="preload" as="image" href="/glitter/Group_1.png" />
    <link rel="preload" as="image" href="/glitter/particle_mask_inverted.png" />

    <!-------------------- Fonts (async loading) -------------------->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inconsolata:wght@200..900&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inconsolata:wght@200..900&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inconsolata:wght@200..900&display=swap" /></noscript>

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script src="/enable-transition.js" defer></script>
  </body>
</html>
